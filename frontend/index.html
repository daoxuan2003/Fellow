<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0F0F">
    <title>共赴 - 登录</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* ============================================
           设计系统 - Design System
           ============================================ */
        
        :root {
            /* 主色调 - 日落渐变系 */
            --color-primary: #FF6B6B;
            --color-secondary: #FF8E8E;
            --color-accent: #FFB4B4;
            
            /* 背景色 */
            --bg-dark: #0A0A0F;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-input: rgba(255, 255, 255, 0.05);
            
            /* 文字色 */
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            
            /* 边框 */
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 107, 107, 0.5);
            
            /* 阴影 */
            --shadow-glow: 0 0 40px rgba(255, 107, 107, 0.15);
            
            /* 圆角 */
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        /* ============================================
           背景动画 - Animated Background
           ============================================ */
        
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        /* 渐变光晕 */
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }
        
        .orb-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            bottom: -150px;
            left: -150px;
            animation-delay: -7s;
            opacity: 0.25;
        }
        
        .orb-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #F093FB 0%, #F5576C 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
            opacity: 0.2;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(20px, 30px) scale(1.02); }
        }
        
        /* 粒子效果 */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.5); }
        }
        
        /* ============================================
           主容器
           ============================================ */
        
        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 48px 24px;
        }
        
        /* ============================================
           Logo区域
           ============================================ */
        
        .brand {
            text-align: center;
            margin-bottom: 48px;
            margin-top: 24px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
        }
        
        /* 心跳Logo - SVG */
        .logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.4));
            animation: heartbeat 2s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1); }
            42% { transform: scale(1.05); }
            70% { transform: scale(1); }
        }
        
        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 50%, #FFB4B4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .brand-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 2px;
        }
        
        /* ============================================
           卡片容器 - Glass Card
           ============================================ */
        
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        /* ============================================
           标签切换 - Animated Tabs
           ============================================ */
        
        .tabs {
            display: flex;
            gap: 8px;
            padding: 4px;
            background: var(--bg-input);
            border-radius: var(--radius-lg);
            margin-bottom: 32px;
            position: relative;
        }
        
        .tab {
            flex: 1;
            padding: 14px 24px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }
        
        .tab.active {
            color: var(--text-primary);
        }
        
        /* 滑动指示器 */
        .tab-indicator {
            position: absolute;
            height: calc(100% - 8px);
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(255, 142, 142, 0.15) 100%);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 107, 107, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            top: 4px;
        }
        
        /* ============================================
           表单样式
           ============================================ */
        
        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-left: 4px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-wrapper input:focus {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }
        
        .input-wrapper input::placeholder {
            color: var(--text-tertiary);
        }
        
        /* 输入框图标 */
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            transition: color 0.3s ease;
        }
        
        .input-wrapper input:focus ~ .input-icon {
            color: var(--color-primary);
        }
        
        /* ============================================
           提交按钮 - Gradient Button
           ============================================ */
        
        .btn-submit {
            width: 100%;
            padding: 18px;
            margin-top: 12px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.5s ease;
        }
        
        .btn-submit:hover::before {
            left: 100%;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ============================================
           底部提示
           ============================================ */
        
        .hint {
            text-align: center;
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-tertiary);
            line-height: 1.8;
        }
        
        .hint-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .hint-line::before,
        .hint-line::after {
            content: '';
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-tertiary), transparent);
        }
        
        /* ============================================
           页面切换动画
           ============================================ */
        
        .fade-enter-active,
        .fade-leave-active {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: translateY(20px);
        }
        
        /* ============================================
           应用内提示 - Toast
           ============================================ */
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-primary);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            max-width: 90%;
            width: max-content;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.success {
            border-color: rgba(34, 197, 94, 0.3);
            background: rgba(34, 197, 94, 0.15);
        }
        
        .toast.success svg {
            color: #22C55E;
        }
        
        .toast.error {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.15);
        }
        
        .toast.error svg {
            color: #EF4444;
        }
        
        /* ============================================
           响应式
           ============================================ */
        
        @media (min-width: 480px) {
            .app {
                max-width: 420px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 动态背景 -->
        <div class="bg-container">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
            <div class="particles">
                <div v-for="n in 30" :key="n" class="particle" :style="{
                    left: Math.random() * 100 + '%',
                    top: Math.random() * 100 + '%',
                    animationDelay: Math.random() * 3 + 's'
                }"></div>
            </div>
        </div>
        
        <!-- 主应用 -->
        <div class="app">
            <!-- Logo区域 -->
            <div class="brand">
                <div class="logo">
                    <!-- SVG 心跳图标 -->
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 外圈 -->
                        <circle cx="50" cy="50" r="45" stroke="url(#gradient1)" stroke-width="2" opacity="0.3"/>
                        <!-- 心跳线 -->
                        <path d="M50 25 C30 10 10 30 10 50 C10 75 50 90 50 90 C50 90 90 75 90 50 C90 30 70 10 50 25" 
                              fill="url(#gradient1)" opacity="0.9"/>
                        <!-- 心电图线条 -->
                        <path d="M20 50 L35 50 L40 35 L50 65 L60 35 L65 50 L80 50" 
                              stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
                        <defs>
                            <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF6B6B"/>
                                <stop offset="100%" style="stop-color:#FF8E8E"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="brand-title" style="font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; font-weight: 500; letter-spacing: 8px;">共赴</h1>
                <p class="brand-subtitle">TOGETHER</p>
            </div>
            
            <!-- 登录卡片 -->
            <div class="card">
                <!-- 标签切换 -->
                <div class="tabs">
                    <div class="tab-indicator" :style="{ width: 'calc(50% - 4px)', left: activeTab === 'login' ? '4px' : 'calc(50%)' }"></div>
                    <button class="tab" :class="{ active: activeTab === 'login' }" @click="activeTab = 'login'">
                        登录
                    </button>
                    <button class="tab" :class="{ active: activeTab === 'register' }" @click="activeTab = 'register'">
                        注册
                    </button>
                </div>
                
                <!-- 登录表单 -->
                <transition name="fade" mode="out-in">
                    <form v-if="activeTab === 'login'" key="login" class="form" @submit.prevent="handleLogin">
                        <div class="input-group">
                            <label>账号</label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    placeholder="邮箱或手机号"
                                    v-model="loginForm.account"
                                    required
                                >
                                <!-- 用户图标 -->
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>密码</label>
                            <div class="input-wrapper">
                                <input 
                                    type="password" 
                                    placeholder="输入密码"
                                    v-model="loginForm.password"
                                    required
                                >
                                <!-- 锁图标 -->
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-submit" :disabled="loading">
                            <span v-if="loading" class="spinner"></span>
                            {{ loading ? '登录中' : '登录' }}
                        </button>
                    </form>
                    
                    <!-- 注册表单 -->
                    <form v-else key="register" class="form" @submit.prevent="handleRegister">
                        <div class="input-group">
                            <label>昵称</label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    placeholder="怎么称呼你"
                                    v-model="registerForm.nickname"
                                    required
                                >
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>账号</label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    placeholder="邮箱或手机号"
                                    v-model="registerForm.account"
                                    required
                                >
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>密码</label>
                            <div class="input-wrapper">
                                <input 
                                    type="password" 
                                    placeholder="至少6位密码"
                                    v-model="registerForm.password"
                                    required
                                    minlength="6"
                                >
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-submit" :disabled="loading">
                            <span v-if="loading" class="spinner"></span>
                            {{ loading ? '注册中' : '开始我们的故事' }}
                        </button>
                    </form>
                </transition>
            </div>
            
            <!-- 底部提示 -->
            <div class="hint">
                <div class="hint-line">专属配对</div>
                <p>注册后获得配对码，与TA绑定专属空间</p>
            </div>
        </div>
    </div>
    
    <!-- 应用内提示系统 -->
    <div class="toast" :class="{ show: toast.show, error: toast.type === 'error', success: toast.type === 'success' }">
        <svg v-if="toast.type === 'success'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <svg v-else-if="toast.type === 'error'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span>{{ toast.message }}</span>
    </div>
    
    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    activeTab: 'login',
                    loading: false,
                    loginForm: {
                        account: '',
                        password: ''
                    },
                    registerForm: {
                        nickname: '',
                        account: '',
                        password: ''
                    },
                    apiUrl: 'http://localhost:3000/api',
                    toast: {
                        show: false,
                        message: '',
                        type: 'info',  // info, success, error
                        timer: null
                    }
                };
            },
            
            mounted() {
                const user = localStorage.getItem('user');
                if (user) {
                    window.location.href = './home.html';
                }
            },
            
            methods: {
                // 显示提示消息
                showToast(message, type = 'info') {
                    // 清除之前的定时器
                    if (this.toast.timer) {
                        clearTimeout(this.toast.timer);
                    }
                    
                    this.toast.message = message;
                    this.toast.type = type;
                    this.toast.show = true;
                    
                    // 2.5秒后自动隐藏
                    this.toast.timer = setTimeout(() => {
                        this.toast.show = false;
                    }, 2500);
                },
                
                async handleLogin() {
                    this.loading = true;
                    
                    try {
                        const response = await fetch(this.apiUrl + '/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.loginForm)
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            localStorage.setItem('user', JSON.stringify(result.data));
                            this.showToast('登录成功', 'success');
                            setTimeout(() => {
                                window.location.href = './home.html';
                            }, 500);
                        } else {
                            this.showToast(result.message, 'error');
                        }
                    } catch (error) {
                        this.showToast('网络错误，请检查服务器', 'error');
                    } finally {
                        this.loading = false;
                    }
                },
                
                async handleRegister() {
                    this.loading = true;
                    
                    try {
                        const response = await fetch(this.apiUrl + '/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.registerForm)
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            localStorage.setItem('user', JSON.stringify(result.data));
                            this.showToast(`注册成功！配对码：${result.data.pairCode}`, 'success');
                            setTimeout(() => {
                                window.location.href = './home.html';
                            }, 2000);
                        } else {
                            this.showToast(result.message, 'error');
                        }
                    } catch (error) {
                        this.showToast('网络错误，请检查服务器', 'error');
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
