<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0F0F">
    <title>共赴 - 我的</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Cropper.js 头像裁剪 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
    <!-- 全局配置文件（自动区分开发/生产环境） -->
    <script src="./config.js"></script>
    <!-- 共享组件样式 -->
    <link rel="stylesheet" href="./components/common.css">
    <style>
        :root {
            --color-primary: #FF6B6B;
            --color-secondary: #FF8E8E;
            --color-accent: #FFB4B4;
            
            --bg-dark: #0A0A0F;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --bg-input: rgba(255, 255, 255, 0.05);
            
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 107, 107, 0.5);
            
            --shadow-glow: 0 0 40px rgba(255, 107, 107, 0.15);
            
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        /* 背景 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
        }
        
        .orb-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            top: -150px;
            right: -150px;
            animation: float 25s ease-in-out infinite;
        }
        
        .orb-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            bottom: 100px;
            left: -150px;
            animation: float 20s ease-in-out infinite reverse;
            opacity: 0.25;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        
        /* 主容器 */
        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding-bottom: 100px;
        }
        
        /* 顶部导航 */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 20px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .header-back {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .header-back:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        
        .header-edit-btn {
            padding: 8px 16px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .header-edit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }
        
        .header-edit-btn.save {
            background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
            color: white;
            min-width: 64px;
        }
        
        .header-edit-btn.save:hover {
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        
        .header-edit-btn.save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .header-edit-btn.cancel {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .header-edit-btn.cancel:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--text-tertiary);
        }
        
        .header-placeholder {
            width: 40px;
        }
        
        /* 编辑模式标签 */
        .edit-mode-badge {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 99;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .edit-mode-badge.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* 主内容 */
        .main {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        
        /* 头像区域 */
        .profile-header {
            text-align: center;
            padding: 20px 0 32px;
        }
        
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }
        
        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-input) 100%);
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        
        .avatar-large {
            cursor: pointer;
        }
        
        .avatar-large:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);
        }
        
        .avatar-large::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #FF6B6B 0%, #764BA2 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        
        .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            background: var(--color-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            border: 3px solid var(--bg-dark);
            transition: all 0.3s ease;
        }
        
        .avatar-edit:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.4);
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .profile-id {
            font-size: 13px;
            color: var(--text-tertiary);
        }
        
        /* 卡片 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title svg {
            color: var(--color-primary);
        }
        
        /* 表单项 */
        .form-item {
            margin-bottom: 20px;
        }
        
        .form-item:last-child {
            margin-bottom: 0;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-left: 4px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }
        
        .form-input[readonly] {
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: default;
            border-color: transparent;
        }
        
        .form-input[readonly]:focus {
            box-shadow: none;
            border-color: transparent;
        }
        
        .form-input::placeholder {
            color: var(--text-tertiary);
        }
        
        /* 性别选择 */
        .gender-select {
            display: flex;
            gap: 12px;
        }
        
        .gender-option {
            flex: 1;
            padding: 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            color: var(--text-secondary);
        }
        
        .gender-option.active {
            background: rgba(255, 107, 107, 0.15);
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        
        .gender-option.disabled {
            cursor: not-allowed;
            opacity: 0.6;
            background: var(--bg-card);
        }
        
        .gender-option.disabled.active {
            background: rgba(255, 107, 107, 0.08);
            border-color: rgba(255, 107, 107, 0.3);
        }
        
        /* 日期选择器 */
        .date-picker-wrapper {
            position: relative;
        }
        
        .date-picker-wrapper input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .date-picker-wrapper input[type="date"][readonly] {
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: default;
            border-color: transparent;
        }
        
        .date-picker-wrapper input[type="date"]:focus {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }
        
        .date-picker-wrapper input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }
        
        /* 设置列表 */
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .setting-item:last-child {
            border-bottom: none;
        }
        
        .setting-item:hover {
            opacity: 0.8;
        }
        
        .setting-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .setting-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-input);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }
        
        .setting-info h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .setting-info p {
            font-size: 12px;
            color: var(--text-tertiary);
        }
        
        .setting-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-tertiary);
        }
        
        /* 开关 */
        .switch {
            width: 48px;
            height: 26px;
            background: var(--bg-input);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }
        
        .switch.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
        }
        
        .switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }
        
        .switch.active::after {
            left: 24px;
        }
        
        /* 保存按钮 */
        .btn-save {
            width: 100%;
            padding: 18px;
            margin-top: 8px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        
        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 底部退出 */
        .logout-section {
            margin-top: 32px;
            padding-top: 16px;
        }
        
        .btn-logout {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-md);
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        /* 解绑按钮 - 低调设计 */
        .btn-unbind {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
        }
        
        .btn-unbind:hover {
            color: #EF4444;
            opacity: 1;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(30, 30, 35, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-primary);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            z-index: 9999;
            max-width: 90%;
            width: max-content;
        }
        
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        
        .toast.success {
            border-color: rgba(34, 197, 94, 0.3);
            background: rgba(34, 197, 94, 0.15);
        }
        
        .toast.success svg {
            color: #22C55E;
        }
        
        .toast.error {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.15);
        }
        
        .toast.error svg {
            color: #EF4444;
        }
        
        /* 确认对话框 */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .confirm-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .confirm-dialog {
            background: linear-gradient(135deg, rgba(30, 30, 35, 0.95) 0%, rgba(20, 20, 25, 0.95) 100%);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 28px;
            width: 320px;
            max-width: 90%;
            text-align: center;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .confirm-overlay.show .confirm-dialog {
            transform: scale(1) translateY(0);
        }
        
        .confirm-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .confirm-message {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .confirm-actions {
            display: flex;
            gap: 12px;
        }
        
        .confirm-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .confirm-btn.cancel {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .confirm-btn.confirm {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
            color: white;
        }
        
        /* 头像裁剪覆盖层 */
        .crop-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .crop-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .crop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 10, 15, 0.8);
        }
        
        .crop-title {
            font-size: 17px;
            font-weight: 600;
        }
        
        .crop-btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: var(--text-secondary);
        }
        
        .crop-btn:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        
        .crop-btn.confirm {
            background: var(--color-primary);
            color: white;
        }
        
        .crop-btn.confirm:hover {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }
        
        /* Cropper.js 定制样式 */
        .cropper-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .cropper-wrap-box,
        .cropper-canvas,
        .cropper-drag-box,
        .cropper-crop-box,
        .cropper-modal {
            border-radius: 0;
        }
        
        /* 圆形裁剪框 */
        .cropper-view-box {
            border-radius: 50%;
            outline: none;
            box-shadow: 0 0 0 2px var(--color-primary);
        }
        
        .cropper-face {
            border-radius: 50%;
        }
        
        /* 隐藏默认的虚线边框 */
        .cropper-dashed {
            display: none;
        }
        
        /* 定制中心点 */
        .cropper-point {
            background-color: var(--color-primary);
        }
        
        /* 定制四条边 */
        .cropper-line {
            background-color: var(--color-primary);
        }
        
        /* 四角的控制点 */
        .cropper-point.point-e,
        .cropper-point.point-n,
        .cropper-point.point-w,
        .cropper-point.point-s {
            display: none;
        }
        
        .crop-footer {
            padding: 20px;
            text-align: center;
        }
        
        .crop-hint-text {
            color: var(--text-tertiary);
            font-size: 13px;
        }
        
    </style>
</head>
<body>
    <div id="app">
        <!-- 背景 -->
        <div class="bg-container">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
        </div>
        
        <!-- 主应用 -->
        <div class="app">
            <!-- 编辑模式标签 -->
            <div class="edit-mode-badge" :class="{ show: isEditing }">编辑模式</div>
            
            <!-- 顶部导航 -->
            <header class="header">
                <div class="header-back" @click="goBack">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <!-- 确认对话框 -->

            <!-- 头像裁剪覆盖层 -->
            <div class="crop-overlay" :class="{ show: cropShow }" v-if="cropShow">
                <div class="crop-header">
                    <button class="crop-btn" @click="cancelCrop">取消</button>
                    <div class="crop-title">裁剪头像</div>
                    <button class="crop-btn confirm" @click="confirmCrop">确定</button>
                </div>
                <div class="cropper-container">
                    <img v-if="cropImageSrc" :src="cropImageSrc" ref="cropImage" alt="裁剪预览" style="max-width: 100%; max-height: 70vh; display: block;">
                </div>

        <!-- 底部导航组件 -->

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    user: {},
                    token: localStorage.getItem('token') || '',
                    editForm: {
                        nickname: '',
                        bio: '',
                        gender: '',
                        account: '',
                        newPassword: '',
                        avatar: '',
                        loveDate: '',
                        partnerNote: ''
                    },
                    originalForm: null,
                    isEditing: false,
                    settings: {
                        notify: true,
                        autoSync: false
                    },
                    saving: false,
                    toast: {
                        show: false,
                        message: '',
                        type: 'info',
                        timer: null
                    },
                    confirm: {
                        show: false,
                        title: '',
                        message: '',
                        confirmText: '确定',
                        cancelText: '取消',
                        onConfirm: null
                    },
                    cropShow: false,
                    cropImageSrc: '',
                    cropImageFile: null,
                    cropper: null,
                    apiUrl: window.CONFIG ? window.CONFIG.API_URL : 'http://localhost:3000/api',
                    ws: null,
                    wsReconnectTimer: null,
                    wsConnected: false
                };
            },
            
            computed: {
                today() {
                    return new Date().toISOString().split('T')[0];
                }
            },
            
            mounted() {
                if (!this.token) {
                    window.location.href = './index.html';
                    return;
                }
                this.fetchUserInfo();
                this.connectWebSocket();
            },
            
            beforeUnmount() {
                if (this.ws) {
                    this.ws.close();
                }
                if (this.wsReconnectTimer) {
                    clearTimeout(this.wsReconnectTimer);
                }
            },
            
            methods: {
                async fetchUserInfo() {
                    try {
                        const res = await fetch(this.apiUrl + '/me', {
                            headers: { 'Authorization': 'Bearer ' + this.token }
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.user = data.data;
                            this.initForm();
                        } else {
                            this.showToast('获取用户信息失败', 'error');
                            window.location.href = './index.html';
                        }
                    } catch (e) {
                        this.showToast('网络错误', 'error');
                        window.location.href = './index.html';
                    }
                },
                
                initForm() {
                    this.editForm.nickname = this.user.nickname || '';
                    this.editForm.account = this.user.account || '';
                    this.editForm.gender = this.user.gender || '';
                    this.editForm.bio = this.user.bio || '';
                    this.editForm.avatar = this.user.avatarUrl || '';
                    this.editForm.partnerNote = this.user.partnerNote || '';
                    if (this.user.boundAt) {
                        this.editForm.loveDate = this.formatDate(new Date(this.user.boundAt));
                    }
                    
                    // 加载本地设置
                    const savedSettings = localStorage.getItem('user_settings');
                    if (savedSettings) {
                        this.settings = JSON.parse(savedSettings);
                    }
                    
                    // 保存原始表单数据
                    this.saveOriginalForm();
                },
                
                saveOriginalForm() {
                    this.originalForm = JSON.parse(JSON.stringify(this.editForm));
                },
                
                formatDate(date) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                },
                
                startEdit() {
                    this.isEditing = true;
                    this.saveOriginalForm();
                },
                
                cancelEdit() {
                    if (this.hasChanges()) {
                        this.confirm = {
                            show: true,
                            title: '放弃修改',
                            message: '您有未保存的修改，确定要放弃吗？',
                            confirmText: '放弃',
                            cancelText: '继续编辑',
                            onConfirm: () => {
                                // 恢复原始数据
                                this.editForm = JSON.parse(JSON.stringify(this.originalForm));
                                this.isEditing = false;
                            }
                        };
                    } else {
                        this.isEditing = false;
                    }
                },
                
                hasChanges() {
                    if (!this.originalForm) return false;
                    return JSON.stringify(this.editForm) !== JSON.stringify(this.originalForm);
                },
                
                selectAvatar() {
                    this.$refs.avatarInput.click();
                },
                
                handleAvatarChange(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    if (file.size > 5 * 1024 * 1024) {
                        this.showToast('图片不能超过5MB', 'error');
                        return;
                    }
                    
                    this.cropImageFile = file;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.cropImageSrc = e.target.result;
                        this.cropShow = true;
                        
                        // 等待DOM更新后初始化cropper
                        this.$nextTick(() => {
                            this.initCropper();
                        });
                    };
                    reader.readAsDataURL(file);
                    
                    // 清空input以便可以再次选择同一文件
                    event.target.value = '';
                },
                
                initCropper() {
                    const image = this.$refs.cropImage;
                    if (!image) return;
                    
                    // 销毁旧的cropper实例
                    if (this.cropper) {
                        this.cropper.destroy();
                    }
                    
                    // 等待图片加载完成
                    image.onload = () => {
                        this.cropper = new Cropper(image, {
                            aspectRatio: 1, // 1:1 正方形
                            viewMode: 1, // 限制裁剪框不超过画布
                            dragMode: 'move', // 拖动模式移动图片
                            autoCropArea: 0.8, // 自动裁剪区域80%
                            restore: false,
                            guides: false,
                            center: false,
                            highlight: false,
                            cropBoxMovable: false, // 裁剪框不可移动
                            cropBoxResizable: false, // 裁剪框不可缩放
                            toggleDragModeOnDblclick: false,
                            minContainerWidth: 300,
                            minContainerHeight: 300,
                            ready: () => {
                                // 设置为圆形裁剪
                                const cropBox = document.querySelector('.cropper-crop-box');
                                const viewBox = document.querySelector('.cropper-view-box');
                                const face = document.querySelector('.cropper-face');
                                if (cropBox) cropBox.style.borderRadius = '50%';
                                if (viewBox) viewBox.style.borderRadius = '50%';
                                if (face) face.style.borderRadius = '50%';
                            }
                        });
                    };
                },
                
                cancelCrop() {
                    this.cropShow = false;
                    this.cropImageSrc = '';
                    this.cropImageFile = null;
                    if (this.cropper) {
                        this.cropper.destroy();
                        this.cropper = null;
                    }
                },
                
                confirmCrop() {
                    if (!this.cropper) return;
                    
                    // 获取裁剪后的canvas（圆形）
                    const canvas = this.cropper.getCroppedCanvas({
                        width: 400,
                        height: 400,
                        fillColor: 'transparent',
                        imageSmoothingEnabled: true,
                        imageSmoothingQuality: 'high'
                    });
                    
                    // 转换为圆形
                    const circularCanvas = document.createElement('canvas');
                    circularCanvas.width = 400;
                    circularCanvas.height = 400;
                    const ctx = circularCanvas.getContext('2d');
                    
                    // 绘制圆形裁剪路径
                    ctx.beginPath();
                    ctx.arc(200, 200, 200, 0, 2 * Math.PI);
                    ctx.closePath();
                    ctx.clip();
                    
                    // 绘制裁剪后的图片
                    ctx.drawImage(canvas, 0, 0);
                    
                    // 转换为Blob并上传
                    circularCanvas.toBlob(async (blob) => {
                        await this.uploadAvatar(blob);
                    }, 'image/jpeg', 0.9);
                },
                
                // 上传头像到服务器
                async uploadAvatar(blob) {
                    try {
                        const formData = new FormData();
                        formData.append('avatar', blob, 'avatar.jpg');
                        
                        const res = await fetch(this.apiUrl + '/upload/avatar', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            },
                            body: formData
                        });
                        
                        const data = await res.json();
                        
                        if (data.success) {
                            // 更新本地头像显示
                            this.user.avatar = data.data.avatar;
                            this.user.avatarUrl = data.data.avatarUrl;
                            this.editForm.avatar = data.data.avatarUrl;
                            this.showToast('头像上传成功', 'success');
                            this.cancelCrop();
                        } else {
                            this.showToast(data.message, 'error');
                        }
                    } catch (e) {
                        console.error('上传头像失败:', e);
                        this.showToast('上传失败，请重试', 'error');
                    }
                },
                
                async saveProfile() {
                    if (!this.editForm.nickname.trim()) {
                        this.showToast('昵称不能为空', 'error');
                        return;
                    }
                    
                    this.saving = true;
                    
                    try {
                        const updateData = {
                            nickname: this.editForm.nickname,
                            bio: this.editForm.bio,
                            gender: this.editForm.gender,
                            account: this.editForm.account,
                            partnerNote: this.editForm.partnerNote
                        };
                        
                        if (this.editForm.newPassword) {
                            updateData.password = this.editForm.newPassword;
                        }
                        
                        if (this.editForm.loveDate && this.user.partnerId) {
                            updateData.boundAt = new Date(this.editForm.loveDate).toISOString();
                        }
                        
                        const res = await fetch(this.apiUrl + '/user/update', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + this.token
                            },
                            body: JSON.stringify(updateData)
                        });
                        
                        const data = await res.json();
                        
                        if (data.success) {
                            // 更新用户数据
                            this.user = { ...this.user, ...data.data };
                            localStorage.setItem('user_settings', JSON.stringify(this.settings));
                            
                            this.showToast('保存成功', 'success');
                            this.editForm.newPassword = '';
                            this.isEditing = false;
                            this.saveOriginalForm();
                        } else {
                            this.showToast(data.message, 'error');
                        }
                    } catch (e) {
                        this.showToast('网络错误', 'error');
                        console.error(e);
                    } finally {
                        this.saving = false;
                    }
                },
                
                showToast(msg, type = 'info') {
                    if (this.toast.timer) clearTimeout(this.toast.timer);
                    this.toast.message = msg;
                    this.toast.type = type;
                    this.toast.show = true;
                    this.toast.timer = setTimeout(() => this.toast.show = false, 2500);
                },
                
                logout() {
                    this.confirm = {
                        show: true,
                        title: '退出登录',
                        message: '确定要退出当前账号吗？',
                        confirmText: '退出',
                        cancelText: '取消',
                        onConfirm: () => {
                            localStorage.removeItem('token');
                            localStorage.removeItem('user_settings');
                            window.location.href = './index.html';
                        }
                    };
                },
                
                cancelConfirm() {
                    this.confirm.show = false;
                },
                
                doConfirm() {
                    if (this.confirm.onConfirm) this.confirm.onConfirm();
                    this.confirm.show = false;
                },
                
                // 解绑（分手）
                unbind() {
                    this.confirm = {
                        show: true,
                        title: '解除绑定',
                        message: '确定要解除与TA的情侣关系吗？此操作不可恢复。',
                        confirmText: '解除绑定',
                        cancelText: '取消',
                        onConfirm: async () => {
                            try {
                                const res = await fetch(this.apiUrl + '/unbind', {
                                    method: 'POST',
                                    headers: { 
                                        'Content-Type': 'application/json',
                                        'Authorization': 'Bearer ' + this.token
                                    }
                                });
                                
                                const data = await res.json();
                                
                                if (data.success) {
                                    this.showToast('已解除绑定', 'success');
                                    
                                    // 更新本地用户状态
                                    this.user = {
                                        ...this.user,
                                        inviteStatus: 'idle',
                                        partnerId: null,
                                        boundAt: null,
                                        partner: null
                                    };
                                    
                                    // 延迟跳转回首页
                                    setTimeout(() => {
                                        window.location.href = './home.html';
                                    }, 1500);
                                } else {
                                    this.showToast(data.message, 'error');
                                }
                            } catch (e) {
                                this.showToast('网络错误', 'error');
                                console.error(e);
                            }
                        }
                    };
                },
                
                goBack() {
                    if (this.isEditing && this.hasChanges()) {
                        this.confirm = {
                            show: true,
                            title: '放弃修改',
                            message: '您有未保存的修改，确定要放弃吗？',
                            confirmText: '放弃',
                            cancelText: '继续编辑',
                            onConfirm: () => {
                                window.location.href = './home.html';
                            }
                        };
                    } else {
                        window.location.href = './home.html';
                    }
                },
                
                // 连接 WebSocket
                connectWebSocket() {
                    try {
                        this.ws = new WebSocket(window.CONFIG ? window.CONFIG.WS_URL : 'ws://localhost:3001');
                        
                        this.ws.onopen = () => {
                            console.log('WebSocket 已连接');
                            this.wsConnected = true;
                            
                            // 发送身份验证
                            this.ws.send(JSON.stringify({
                                type: 'auth',
                                token: this.token
                            }));
                        };
                        
                        this.ws.onmessage = (event) => {
                            try {
                                const data = JSON.parse(event.data);
                                this.handleWebSocketMessage(data);
                            } catch (e) {
                                console.error('WebSocket 消息解析失败:', e);
                            }
                        };
                        
                        this.ws.onclose = () => {
                            console.log('WebSocket 已断开');
                            this.wsConnected = false;
                            this.wsReconnectTimer = setTimeout(() => {
                                this.connectWebSocket();
                            }, 3000);
                        };
                        
                        this.ws.onerror = (error) => {
                            console.error('WebSocket 错误:', error);
                        };
                        
                    } catch (e) {
                        console.error('WebSocket 连接失败:', e);
                    }
                },
                
                // 处理 WebSocket 消息
                handleWebSocketMessage(data) {
                    switch (data.type) {
                        case 'connected':
                            console.log('WebSocket 连接成功:', data.message);
                            break;
                            
                        case 'partnerUpdated':
                            console.log('收到伴侣更新:', data.data);
                            this.handlePartnerUpdate(data.data);
                            break;
                            
                        default:
                            console.log('未知的 WebSocket 消息类型:', data.type);
                    }
                },
                
                // 处理伴侣更新
                handlePartnerUpdate(data) {
                    // 更新纪念日
                    if (data.boundAt) {
                        this.user.boundAt = data.boundAt;
                        this.editForm.loveDate = new Date(data.boundAt).toISOString().split('T')[0];
                    }
                    
                    // 更新伴侣信息
                    if (data.partner) {
                        // 更新本地用户信息中的伴侣数据（创建新对象避免代理问题）
                        const updatedUser = {
                            ...this.user,
                            partner: { ...(this.user.partner || {}), ...data.partner }
                        };
                        this.user = updatedUser;
                    }
                    

                    
                    // 显示提示
                    this.showToast('伴侣更新了资料', 'success');
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
