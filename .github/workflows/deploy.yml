name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. 设置 Node.js 20
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend_source/package-lock.json
    
    # 显示 Node 版本
    - name: Check Node Version
      run: node -v && npm -v
    
    # 3. 构建前端
    - name: Build Frontend
      run: |
        cd frontend_source
        npm ci
        npm run build
    
    # 4. 部署前备份数据库（防止部署失误导致数据丢失）
    - name: Backup Database Before Deploy
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /www/wwwroot/couple-website/backend
          npm run backup || echo "⚠️  备份失败，继续部署..."

    # 5. 部署到服务器
    - name: Deploy to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "frontend/dist/*,backend/*,ecosystem.config.js,package*.json"
        target: "/www/wwwroot/couple-website"
        strip_components: 0
        overwrite: true
    
    # 6. 重启服务
    - name: Restart Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /www/wwwroot/couple-website
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) { console.error('❌ 生产服务器 Node.js 版本需 >= 20，当前 ' + process.version); process.exit(1); }"
          cd backend
          npm install --production
          NODE_ENV=production node -e "require('dotenv').config(); require('./config/auth'); console.log('✅ 安全配置校验通过')"
          cd ..
          pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
          echo "✅ 部署完成！"
    
    # 7. 健康检查
    - name: Health Check
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          echo "🧪 测试网站是否可访问..."
          sleep 3
          if curl --fail --silent --show-error http://localhost:3000/api/vapid-public-key > /dev/null; then
            echo "✅ API 正常"
          else
            echo "❌ API 异常"
            exit 1
          fi
          pm2 status
