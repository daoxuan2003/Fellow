name: Test

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'style/**'
      - 'hotfix/**'
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          frontend_source/package-lock.json
          backend/package-lock.json
    
    # 2. 测试前端构建
    - name: Test Frontend Build
      run: |
        cd frontend_source
        npm ci
        npm run build
        echo "✅ 前端构建成功"
    
    # 3. 检查全部后端 JavaScript 语法
    - name: Test Backend Syntax
      run: |
        cd backend
        npm ci
        npm run verify
        echo "✅ 后端语法与自动化测试通过"
