name: Release Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve release refs
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "main=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "develop=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --prune origin main develop
            echo "main=origin/main" >> "$GITHUB_OUTPUT"
            echo "develop=origin/develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release gate
        shell: bash
        run: |
          set +e
          node scripts/ai/release-gate.mjs \
            --main="${{ steps.refs.outputs.main }}" \
            --develop="${{ steps.refs.outputs.develop }}" \
            --strict \
            --output=.ai-reports/release-gate.json
          gate_status=$?
          node scripts/ai/report-safety-check.mjs .ai-reports/release-gate.json
          safety_status=$?
          if [ "$gate_status" -ne 0 ] || [ "$safety_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload release-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: .ai-reports/release-gate.json
          if-no-files-found: ignore
          retention-days: 7
